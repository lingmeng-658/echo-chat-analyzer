[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qq-chat-analyzer"
version = "0.1.0"
description = "A privacy-first, fully local QQ and WeChat chat analyzer."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jieba>=0.42.1,<0.43",
    "matplotlib>=3.8,<4",
    "wordcloud>=1.9.3,<2",
    "zstandard>=0.22,<1",
]

[project.scripts]
echo-chat = "qq_chat_analyzer.cli:main"
echo-gui = "qq_chat_analyzer.gui.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]
gui = [
    "PySide6>=6.6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow_integration: heavy integration excluded from the Fast Suite (real subprocess/browser/packaging/Qt-heavy)",
    "known_failure: pre-existing known-failing test quarantined from the Fast Suite (not fixed by this task)",
]
