[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qq-chat-analyzer"
version = "0.1.0"
description = "A fully local analyzer for QQChatExporter JSON exports."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jieba>=0.42.1,<0.43",
    "matplotlib>=3.8,<4",
    "pandas>=2.2,<3",
    "wordcloud>=1.9.3,<2",
]

[project.scripts]
qqchat = "qq_chat_analyzer.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
